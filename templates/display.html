<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Display PDF with Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .pdf-container {
            height: 500px;
        }
        h1 {
            color: #343a40;
        }
    </style>
</head>
<body>
   <div class="container mt-5">
       <h1 class="text-center">PDF Display with Images</h1>
       
       <div class="row justify-content-center mb-4 pdf-container">
           <div class="col-12">
               <embed src="{{ pdf_url }}" type="application/pdf" width="100%" height="100%">
           </div>
       </div>

       <div class="text-center mb-4">
           <a href="/remove" class="btn btn-danger">Remove PDF</a>
       </div>
   </div>
</body>
</html>
